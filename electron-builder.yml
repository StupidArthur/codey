appId: ai.opencode.temporal-workspace
productName: Temporal Workspace OpenCode
directories:
  output: release
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
extraResources:
  - from: vendor/opencode/opencode.exe
    to: opencode/opencode.exe
asar: false
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
