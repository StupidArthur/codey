<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Temporal Workspace — Single Session</title>
<style>
:root{--bg:#eef1f5;--glass:rgba(255,255,255,.82);--surface:#fff;--line:rgba(17,24,39,.08);--text:#111827;--muted:#6b7280;--blue:#3478f6;--blueSoft:rgba(52,120,246,.09);--green:#22c55e;--shadow:0 24px 70px rgba(17,24,39,.13)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#f7f8fa,#edf1f5);overflow:hidden}button,textarea{font:inherit}.app{height:100vh;padding:14px}.window{height:100%;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.76);background:var(--glass);backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--shadow);display:grid;grid-template-rows:46px minmax(0,1fr)}
.titlebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,255,255,.62))}.traffic{display:flex;gap:7px}.dot{width:11px;height:11px;border-radius:50%}.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}.window-title{font-size:12px;font-weight:650;color:#374151}.top-right{justify-self:end;display:flex;gap:6px}.chip{font-size:10px;color:var(--muted);padding:5px 8px;border:1px solid var(--line);background:rgba(255,255,255,.72);border-radius:999px}
.shell{min-height:0;display:grid;grid-template-columns:205px minmax(0,1fr);transition:grid-template-columns .18s ease}.shell.collapsed{grid-template-columns:50px minmax(0,1fr)}.sidebar{min-width:0;border-right:1px solid var(--line);background:rgba(248,250,252,.62);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.sidebar-head{padding:9px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:8px}.collapse{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:#4b5563}.session-info{min-width:0}.session-info h1{margin:0 0 3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-info p{margin:0;color:var(--muted);font-size:10px;line-height:1.35}.shell.collapsed .session-info,.shell.collapsed .round-copy,.shell.collapsed .runner-mini-copy{display:none}.shell.collapsed .sidebar-head{justify-content:center;padding-inline:7px}
.rounds{padding:9px 7px;overflow:auto;display:grid;align-content:start;gap:7px}.round{border:1px solid var(--line);background:rgba(255,255,255,.82);border-radius:11px;padding:8px;cursor:pointer}.round.active{border-color:rgba(52,120,246,.32);background:linear-gradient(180deg,#fff,#f8fbff);box-shadow:0 6px 18px rgba(52,120,246,.07)}.round-top{display:flex;justify-content:space-between;gap:6px}.round-n{font-size:9px;font-weight:760;color:var(--blue);background:var(--blueSoft);padding:3px 6px;border-radius:999px}.round-mode{font-size:9px;color:#4b5563;border:1px solid var(--line);padding:3px 6px;border-radius:999px;background:#fff}.round-title{margin-top:6px;font-size:11px;font-weight:680}.round-sub{margin-top:3px;font-size:9px;color:var(--muted)}.shell.collapsed .round{padding:7px 4px;text-align:center}.shell.collapsed .round-top{justify-content:center}.shell.collapsed .round-mode{display:none}
.sidebar-bottom{border-top:1px solid var(--line);padding:7px}.runner-mini{display:none;align-items:center;gap:7px;border:1px solid rgba(17,24,39,.12);background:#111827;color:#fff;border-radius:9px;padding:8px;cursor:pointer;min-width:0}.runner-mini.visible{display:flex}.runner-mini .pulse,.pulse{width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.09);flex:0 0 auto}.runner-mini-copy{min-width:0}.runner-mini strong{display:block;font-size:9px}.runner-mini span{display:block;color:#c5cbd4;font-size:8px;margin-top:1px}.shell.collapsed .runner-mini{justify-content:center;padding:8px 6px}
.main{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}.left{min-width:0;min-height:0;padding:18px;overflow:auto;position:relative;border-right:1px solid var(--line);background:rgba(255,255,255,.20)}.blank{height:100%;display:none;place-items:center}.blank.show{display:grid}.blank-card{text-align:center;color:var(--muted)}.blank-icon{width:52px;height:52px;margin:0 auto 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:22px}.blank-card strong{display:block;color:#374151;font-size:13px;margin-bottom:4px}.blank-card span{font-size:10px}
.page{max-width:860px;margin:0 auto;background:#fff;border:1px solid rgba(17,24,39,.06);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 16px 38px rgba(17,24,39,.07);overflow:hidden}.page.hidden{display:none}.page-head{padding:17px 22px 14px;border-bottom:1px solid #eef2f7}.kicker{font-size:9px;font-weight:760;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.page h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}.page-sub{font-size:10px;color:var(--muted);line-height:1.4;margin:0}.page-body{padding:17px 22px 23px}.page-body h2{font-size:15px;margin:19px 0 6px}.page-body h2:first-child{margin-top:0}.page-body p,.page-body li{font-size:12px;line-height:1.62;color:#273142}.page-body ul,.page-body ol{padding-left:19px}.page-body code{font-family:"SFMono-Regular",Consolas,monospace;background:#f4f6f8;border-radius:5px;padding:1px 4px;font-size:11px}.version-row{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}.version{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 7px;background:#fafbfc}.version.active{color:var(--blue);background:var(--blueSoft);border-color:rgba(52,120,246,.2)}.chat{display:grid;gap:8px}.msg{max-width:86%;padding:8px 10px;border-radius:11px;font-size:11px;line-height:1.55}.msg.user{justify-self:end;background:#edf5ff;border:1px solid #dbeafe}.msg.agent{justify-self:start;background:#f7f8fa;border:1px solid #edf1f5}.who{display:block;font-size:8px;font-weight:760;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.runner-full{position:absolute;left:28px;right:28px;bottom:24px;max-height:43%;background:rgba(18,20,25,.97);color:#f3f4f6;border-radius:14px;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 50px rgba(0,0,0,.24);overflow:hidden;z-index:20;display:none}.runner-full.visible{display:block}.runner-head{height:40px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08)}.runner-title{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700}.runner-head button{border:0;background:transparent;color:#c5c9d1;cursor:pointer;font-size:9px}.runner-body{padding:9px 11px 10px;overflow:auto;max-height:calc(43vh - 40px);font-family:"SFMono-Regular",Consolas,monospace;font-size:9px;line-height:1.52}.evt{padding:5px 7px;border-radius:7px;margin-bottom:4px;background:rgba(255,255,255,.035)}.evt span{color:#8ea4ff}.evt.tool span{color:#8ee0bb}.evt.verify span{color:#ffd98e}
.right{min-width:0;min-height:0;background:rgba(248,250,252,.70);display:grid;grid-template-rows:auto minmax(0,1fr) auto}.right-head{padding:7px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}.mode-switch,.view-switch{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px;background:#fff}.mode-switch button,.view-switch button{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:5px 8px;font-size:10px;font-weight:680;cursor:pointer}.mode-switch button.active,.view-switch button.active{background:#f2f4f7;color:#111827}.spec-wrap{min-height:0;padding:8px;position:relative}.spec-editor,.spec-rendered{position:absolute;inset:8px;border:1px solid #e5eaf0;border-radius:12px;background:#fff;padding:13px;overflow:auto}.spec-editor{resize:none;outline:none;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;line-height:1.62;color:#1f2937}.spec-rendered{display:none}.spec-rendered h1{font-size:20px;margin:0 0 11px}.spec-rendered h2{font-size:14px;margin:17px 0 5px}.spec-rendered p,.spec-rendered li{font-size:12px;line-height:1.62;color:#273142}.spec-rendered ul{padding-left:18px}.right-foot{padding:8px 9px 9px;border-top:1px solid var(--line)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.secondary,.primary{border-radius:9px;padding:8px 10px;font-size:11px;font-weight:680;cursor:pointer}.secondary{border:1px solid #e1e6ec;background:#fff;color:#374151}.primary{border:0;background:#111827;color:#fff}.primary:disabled{opacity:.45;cursor:default}.secondary:disabled{opacity:.45;cursor:default}
@media(max-width:1040px){.main{grid-template-columns:minmax(0,1fr) 350px}.shell{grid-template-columns:185px minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app"><div class="window">
<header class="titlebar"><div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><div class="window-title" id="windowTitle">Auth Refactor — Temporal Workspace</div><div class="top-right"><span class="chip">workspace-write</span><span class="chip">SDK connected</span></div></header>
<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="sidebar-head"><button class="collapse" id="collapseBtn">☰</button><div class="session-info"><h1 id="sessionTitle">Auth Refactor</h1><p>~/repo/app</p></div></div>
    <div class="rounds" id="rounds"></div>
    <div class="sidebar-bottom"><div class="runner-mini" id="runnerMini"><span class="pulse"></span><div class="runner-mini-copy"><strong id="miniTitle">Running</strong><span id="miniMeta">working…</span></div></div></div>
  </aside>

  <main class="main">
    <section class="left">
      <div class="blank" id="blank"><div class="blank-card"><div class="blank-icon">□</div><strong>还没有成果页</strong><span>在右侧写第一份 Spec。默认从 Plan 开始。</span></div></div>
      <article class="page" id="page"><div class="page-head"><div class="kicker" id="kicker"></div><h1 id="pageTitle"></h1><p class="page-sub" id="pageSub"></p></div><div class="page-body" id="pageBody"></div></article>
      <div class="runner-full" id="runnerFull"><div class="runner-head"><div class="runner-title"><span class="pulse"></span><span id="runnerTitle">Running · Plan</span></div><button id="minimizeRunner">收起到侧栏</button></div><div class="runner-body" id="runnerBody"></div></div>
    </section>

    <aside class="right">
      <div class="right-head"><div class="mode-switch"><button data-mode="Plan" class="active">Plan</button><button data-mode="Vibe">Vibe</button><button data-mode="Loop">Loop</button></div><div class="view-switch"><button class="active" data-view="source">源码</button><button data-view="render">MD</button></div></div>
      <div class="spec-wrap"><textarea class="spec-editor" id="specEditor"># Spec\n\n</textarea><div class="spec-rendered" id="specRendered"></div></div>
      <div class="right-foot"><div class="actions"><button class="secondary" id="endRound">结束当前轮次</button><button class="primary" id="submitBtn">提交</button></div></div>
    </aside>
  </main>
</div>
</div></div>
<script>
const qs=new URLSearchParams(location.search); const isNew=qs.get('new')==='1';
const shell=document.getElementById('shell'),roundsEl=document.getElementById('rounds'),page=document.getElementById('page'),blank=document.getElementById('blank'),kicker=document.getElementById('kicker'),pageTitle=document.getElementById('pageTitle'),pageSub=document.getElementById('pageSub'),pageBody=document.getElementById('pageBody'),editor=document.getElementById('specEditor'),rendered=document.getElementById('specRendered'),submit=document.getElementById('submitBtn'),endRound=document.getElementById('endRound'),runner=document.getElementById('runnerFull'),mini=document.getElementById('runnerMini'),runnerTitle=document.getElementById('runnerTitle'),runnerBody=document.getElementById('runnerBody');
let selectedMode='Plan',running=false,openRound=null,roundSeq=0;
let rounds=[];
if(!isNew){rounds=[
 {id:1,mode:'Plan',title:'认证模块重构方案',sub:'v3 · latest',closed:true,versions:3,body:`<div class="version-row"><span class="version">v1</span><span class="version">v2</span><span class="version active">v3 · latest</span></div><h2>目标</h2><p>把 token 生命周期从 controller 中拆出，形成独立 service，同时保持现有 API contract 不变。</p><h2>执行顺序</h2><ol><li>抽离 refresh-token 逻辑。</li><li>迁移 token rotation 与异常处理。</li><li>补齐异常路径测试。</li></ol>`},
 {id:2,mode:'Vibe',title:'第一阶段重构',sub:'3 interactions',closed:true,body:`<h2>Summary</h2><p>完成 refresh-token service 抽离与基础异常迁移。</p><h2>Verification</h2><ul><li>36 tests passed</li><li>typecheck passed</li></ul><h2>Conversation</h2><div class="chat"><div class="msg user"><span class="who">You</span>先把 refresh-token 的逻辑抽出来。</div><div class="msg agent"><span class="who">Agent</span>已完成 service 抽离。</div><div class="msg user"><span class="who">You</span>把 rotation 异常分支也迁过去。</div><div class="msg agent"><span class="who">Agent</span>已迁移并补测试。</div></div>`},
 {id:3,mode:'Loop',title:'补齐 refresh-token 全链路',sub:'completed',closed:true,body:`<h2>Summary</h2><p>refresh-token 全链路重构已完成。token 验证、rotation、失效和异常映射均集中到 service 层。</p><h2>Changes</h2><ul><li>完善 <code>RefreshTokenService</code></li><li>移除 controller 中遗留分支</li><li>补充异常路径测试</li></ul><h2>Verification</h2><ul><li>42 tests passed</li><li>typecheck passed</li><li>API behavior unchanged</li></ul>`}
]; roundSeq=3;}
function titleFor(mode){return mode==='Plan'?'计划更新':mode==='Vibe'?'Vibe 工作记录':'Loop Result'}
function renderRoundList(){roundsEl.innerHTML='';rounds.forEach((r,i)=>{const el=document.createElement('div');el.className='round'+(i===rounds.length-1?' active':'');el.dataset.id=r.id;el.innerHTML=`<div class="round-top"><span class="round-n">${r.id}</span><span class="round-mode">${r.mode}</span></div><div class="round-copy"><div class="round-title">${r.title}</div><div class="round-sub">${r.sub}</div></div>`;el.onclick=()=>selectRound(r.id);roundsEl.appendChild(el)});}
function selectRound(id){document.querySelectorAll('.round').forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===id));const r=rounds.find(x=>x.id===id);if(!r)return;blank.classList.remove('show');page.classList.remove('hidden');kicker.textContent=`Round ${r.id} · ${r.mode}`;pageTitle.textContent=r.title;pageSub.textContent=r.mode==='Plan'?'当前展示最新版本；历史版本仍保留。':r.mode==='Vibe'?'同一 Vibe Round 的连续输入输出保留在这一页。':'最终成果页。';pageBody.innerHTML=r.body;}
function showBlank(){page.classList.add('hidden');blank.classList.add('show')}
function setMode(mode){if(running)return;if(openRound && openRound.mode!==mode && (openRound.mode==='Plan'||openRound.mode==='Vibe'))closeCurrentRound();selectedMode=mode;document.querySelectorAll('.mode-switch button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
document.querySelectorAll('.mode-switch button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
document.getElementById('collapseBtn').onclick=()=>shell.classList.toggle('collapsed');
function logLines(mode){return mode==='Plan'?[['thinking','reviewing current plan and latest feedback…'],['tool','read relevant project files'],['thinking','reconciling constraints and implementation order…']]:mode==='Vibe'?[['thinking','working through the requested change…'],['tool','read src/auth/controller.ts'],['tool','edit src/auth/service.ts'],['verify','run targeted tests']]:[['thinking','evaluating root spec and current gap…'],['tool','inspect workspace diff'],['tool','run tests'],['thinking','remaining gap found; continuing execution…'],['verify','verification passed']];}
function startRun(){if(running)return;running=true;submit.disabled=true;endRound.disabled=true;runner.classList.add('visible');mini.classList.remove('visible');runnerTitle.textContent='Running · '+selectedMode;runnerBody.innerHTML='';let i=0;const lines=logLines(selectedMode);const timer=setInterval(()=>{if(i<lines.length){const [kind,text]=lines[i++];runnerBody.innerHTML+=`<div class="evt ${kind}"><span>${kind}</span> ${text}</div>`;runnerBody.scrollTop=runnerBody.scrollHeight}else{clearInterval(timer);setTimeout(finishRun,500)}},360)}
function finishRun(){runner.classList.remove('visible');mini.classList.remove('visible');running=false;submit.disabled=false;endRound.disabled=false;const spec=editor.value.trim()||'# Spec';
 if(selectedMode==='Plan'){
   let r=openRound&&openRound.mode==='Plan'?openRound:null;
   if(!r){r={id:++roundSeq,mode:'Plan',title:'Plan',sub:'v1 · latest',closed:false,versions:0,body:''};rounds.push(r);openRound=r;}
   r.versions=(r.versions||0)+1;r.title='Plan · '+(spec.split('\n').find(x=>x.trim()&&!x.startsWith('#'))||'New plan').slice(0,28);r.sub=`v${r.versions} · latest`;let chips='';for(let n=1;n<=r.versions;n++)chips+=`<span class="version ${n===r.versions?'active':''}">v${n}${n===r.versions?' · latest':''}</span>`;r.body=`<div class="version-row">${chips}</div><h2>Plan</h2><p>${escapeHtml(spec.replace(/^# Spec\s*/,'').replace(/\n+/g,' '))}</p><h2>Next steps</h2><ol><li>Inspect relevant code and constraints.</li><li>Apply the smallest coherent change.</li><li>Verify before moving to implementation.</li></ol>`;
 } else if(selectedMode==='Vibe'){
   let r=openRound&&openRound.mode==='Vibe'?openRound:null;
   if(!r){r={id:++roundSeq,mode:'Vibe',title:'Vibe work',sub:'1 interaction · active',closed:false,count:0,messages:[],body:''};rounds.push(r);openRound=r;}
   r.count=(r.count||0)+1;r.title='Vibe · '+(spec.split('\n').find(x=>x.trim()&&!x.startsWith('#'))||'work').slice(0,28);r.sub=`${r.count} interaction${r.count>1?'s':''} · active`;r.messages.push({u:spec,a:'已完成这一轮 Vibe 工作，并保留了实际输出与验证信息。'});r.body='<h2>Conversation</h2><div class="chat">'+r.messages.map(m=>`<div class="msg user"><span class="who">You</span>${escapeHtml(m.u)}</div><div class="msg agent"><span class="who">Agent</span>${escapeHtml(m.a)}</div>`).join('')+'</div>';
 } else {
   const r={id:++roundSeq,mode:'Loop',title:'Loop · '+(spec.split('\n').find(x=>x.trim()&&!x.startsWith('#'))||'result').slice(0,28),sub:'completed',closed:true,body:`<h2>Summary</h2><p>本轮 Loop 已按 root spec 完成执行并收敛。</p><h2>Changes</h2><ul><li>完成目标范围内的实际修改</li><li>保留最终 workspace 状态作为事实来源</li></ul><h2>Verification</h2><ul><li>tests passed</li><li>typecheck passed</li></ul>`};rounds.push(r);openRound=null;
 }
 renderRoundList();selectRound(rounds[rounds.length-1].id);
}
function closeCurrentRound(){if(!openRound)return;if(openRound.mode==='Vibe'){openRound.closed=true;openRound.sub=`${openRound.count} interaction${openRound.count>1?'s':''} · closed`;openRound.body=`<h2>Summary</h2><p>本轮 Vibe 的连续工作已结束。</p><h2>Changes</h2><ul><li>完成本轮对话中确认的修改</li></ul><h2>Verification</h2><ul><li>以本轮实际工具与测试证据为准</li></ul>`+openRound.body;}else if(openRound.mode==='Plan'){openRound.closed=true;openRound.sub=`v${openRound.versions} · finalized`;}openRound=null;renderRoundList();if(rounds.length)selectRound(rounds[rounds.length-1].id)}
function escapeHtml(s){return s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
submit.onclick=startRun;endRound.onclick=closeCurrentRound;document.getElementById('minimizeRunner').onclick=()=>{runner.classList.remove('visible');mini.classList.add('visible');document.getElementById('miniTitle').textContent=selectedMode+' running';document.getElementById('miniMeta').textContent='live execution'};mini.onclick=()=>{mini.classList.remove('visible');runner.classList.add('visible')};
function renderMd(src){let s=escapeHtml(src).replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>');const lines=s.split('\n');let out='',ul=false;for(const line of lines){if(/^- /.test(line)){if(!ul){out+='<ul>';ul=true}out+='<li>'+line.slice(2)+'</li>';continue}if(ul){out+='</ul>';ul=false}if(/^<h[12]>/.test(line))out+=line;else if(line.trim())out+='<p>'+line+'</p>'}if(ul)out+='</ul>';return out}
document.querySelectorAll('.view-switch button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view-switch button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='render'){rendered.innerHTML=renderMd(editor.value);editor.style.display='none';rendered.style.display='block'}else{rendered.style.display='none';editor.style.display='block'}});
if(isNew){document.getElementById('sessionTitle').textContent='New Session';document.getElementById('windowTitle').textContent='New Session — Temporal Workspace';rounds=[];roundSeq=0;renderRoundList();showBlank();selectedMode='Plan';setMode('Plan');editor.value='# Spec\n\n';}
else{renderRoundList();selectRound(3);editor.value='# Spec\n\n继续处理 access-token 错误类型统一。\n\n## Constraints\n\n- 不改变 API 返回结构\n- 保持当前测试通过';}
</script>
</body>
</html>
